[project]
name = "caba-rental-monitor"
version = "1.0.0"
description = "Monitors Buenos Aires (CABA) rental listings and notifies new matches over Telegram"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP006", "UP007", "UP030", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
